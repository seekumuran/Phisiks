# Cross-platform build check: Linux (GCC), macOS (Apple Clang, OpenGL 4.1 tier), Windows (MSVC).
# All three build the portable configuration: native physics + miniaudio + GLFW from the system or
# CMake FetchContent, with the portable third-party sources fetched by tools/fetch_deps.py (the
# Windows PhysX build needs the vendored SDK binaries and is checked locally, see docs/BUILD.md).
# Runners have no GPU: the headless unit tests and the headless deterministic-replay test run
# everywhere; Linux additionally tries the runtime autotest on Mesa llvmpipe (software OpenGL,
# 4.1 tier) under Xvfb, reported but not blocking.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglfw3-dev libgl1-mesa-dev libasound2-dev xvfb mesa-utils
      - name: Third-party sources
        run: python3 tools/fetch_deps.py
      - name: Configure
        run: cmake --preset linux-release -DPHISIKS_TEST_SKIP_RENDER=ON
      - name: Build
        run: cmake --build --preset linux-release --parallel
      - name: Tests (unit, layering, deterministic replay)
        run: ctest --preset linux-release
      - name: Runtime autotest on llvmpipe (OpenGL 4.1 tier, informational)
        continue-on-error: true
        timeout-minutes: 30
        run: xvfb-run -a -s "-screen 0 1280x800x24" ./Build/bin-linux-release/Release/PhisiksLab --autotest --gl41 --run-dir Build/runs/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-runs
          path: Build/runs
          if-no-files-found: ignore

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ninja glfw
      - name: Third-party sources
        run: python3 tools/fetch_deps.py
      - name: Configure
        run: cmake --preset macos-release -DPHISIKS_TEST_SKIP_RENDER=ON
      - name: Build
        run: cmake --build --preset macos-release --parallel
      - name: Tests (unit, layering, deterministic replay)
        run: ctest --preset macos-release

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Third-party sources
        run: python tools/fetch_deps.py
      - name: Configure (portable backends, GLFW via FetchContent)
        run: cmake -S . -B Build/ci -G "Visual Studio 17 2022" -A x64 -DPHISIKS_PHYSICS_BACKEND=Native -DPHISIKS_AUDIO_BACKEND=miniaudio -DPHISIKS_TEST_SKIP_RENDER=ON
      - name: Build
        run: cmake --build Build/ci --config Release --parallel
      - name: Tests (unit, layering, deterministic replay)
        run: ctest --test-dir Build/ci -C Release --output-on-failure
