# Release: on a version tag (v1.0.0, ...) build Release binaries on Windows, Linux and macOS,
# package them with CPack into portable archives and publish them on the GitHub Release page.
#
#   Phisiks-<version>-win64.zip          Windows x64   (MSVC, native physics + miniaudio, app-local MSVC runtime)
#   Phisiks-<version>-linux-x86_64.tar.gz Linux x64    (GCC 12 on Ubuntu 22.04: glibc 2.35+)
#   Phisiks-<version>-macos.zip          macOS 11+     (universal arm64 + x86_64, OpenGL 4.1 tier, unsigned)
#
# All three use the portable backends (the vendored PhysX SDK binaries are not available on the
# runners) and build GLFW from source as a static library (PHISIKS_BUNDLED_GLFW), so the archives
# need nothing but the OS and its OpenGL driver. Runners have no GPU: the headless tests run before
# packaging; the rendered autotests are run locally (docs/BUILD.md, "Release package").
name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows
            configure: cmake -S . -B Build/release -G "Visual Studio 17 2022" -A x64 -DPHISIKS_PHYSICS_BACKEND=Native -DPHISIKS_AUDIO_BACKEND=miniaudio -DPHISIKS_TEST_SKIP_RENDER=ON
          - os: ubuntu-22.04
            name: linux
            configure: cmake -S . -B Build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 -DPHISIKS_PHYSICS_BACKEND=Native -DPHISIKS_AUDIO_BACKEND=miniaudio -DPHISIKS_BUNDLED_GLFW=ON -DPHISIKS_TEST_SKIP_RENDER=ON
          - os: macos-14
            name: macos
            configure: cmake -S . -B Build/release -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DPHISIKS_PHYSICS_BACKEND=Native -DPHISIKS_AUDIO_BACKEND=miniaudio -DPHISIKS_BUNDLED_GLFW=ON -DPHISIKS_TEST_SKIP_RENDER=ON
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the CMake project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^project(Phisiks VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "CMake version: $version, tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"

      - name: System packages (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-12 g++-12 libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Tools (macOS)
        if: matrix.name == 'macos'
        run: brew install ninja

      - name: Third-party sources
        run: python3 tools/fetch_deps.py || python tools/fetch_deps.py
      - name: Configure
        run: ${{ matrix.configure }}
      - name: Build
        run: cmake --build Build/release --config Release --parallel
      - name: Tests (unit, layering, deterministic replay)
        run: ctest --test-dir Build/release -C Release --output-on-failure
      - name: Package (CPack)
        run: cpack --config Build/release/CPackConfig.cmake -C Release

      - name: Check the archive contents
        run: |
          cd dist
          archive=$(ls Phisiks-*.zip Phisiks-*.tar.gz 2>/dev/null | head -n 1)
          echo "archive: $archive"
          mkdir check
          case "$archive" in
            *.zip) (cd check && unzip -q "../$archive") ;;
            *)     tar -xzf "$archive" -C check ;;
          esac
          root=$(ls -d check/Phisiks-*)
          ext=""; [ "${{ matrix.name }}" = "windows" ] && ext=".exe"
          for exe in PhisiksLab Showcase01_RoboticArm Showcase02_PoolFluid Showcase03_BlackHole Showcase04_TurbineCad glprobe; do
            test -f "$root/$exe$ext" || { echo "missing $exe$ext"; exit 1; }
          done
          for f in QUICKSTART.txt LICENSE THIRD_PARTY_NOTICES.md README.md assets/shaders/black_hole.frag.glsl \
                   assets/meshes/hero assets/scripts shaders/tonemap.frag.glsl; do
            test -e "$root/$f" || { echo "missing $f"; exit 1; }
          done
          if [ "${{ matrix.name }}" = "linux" ]; then
            ldd "$root/PhisiksLab" | tee ldd.txt
            ! grep -q "not found" ldd.txt
          fi
          if [ "${{ matrix.name }}" = "macos" ]; then
            otool -L "$root/PhisiksLab"
            lipo -info "$root/PhisiksLab"
          fi
          rm -rf check ldd.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phisiks-${{ matrix.name }}
          path: |
            dist/Phisiks-*.zip
            dist/Phisiks-*.tar.gz
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          (cd dist && sha256sum Phisiks-* > SHA256SUMS.txt)
          notes="Portable builds of Phisiks ${GITHUB_REF_NAME}: extract the archive for your OS and run PhisiksLab or one of the four showcases (see QUICKSTART.txt inside). No build tools or installer needed."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Phisiks ${GITHUB_REF_NAME}" --notes "$notes"
          fi
